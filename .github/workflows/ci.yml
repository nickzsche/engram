name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      # package-lock.json is the frozen source of truth; `npm ci` keeps the
      # build reproducible (bun would rewrite the lockfile).
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
